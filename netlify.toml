# ── Verifica Correos — Configuración de Netlify ──────────────────────────────
#
# Despliegue:
#   1. Sube este repositorio a GitHub.
#   2. En Netlify → "Import from Git" → selecciona el repo.
#   3. En Site settings → Environment variables, añade:
#      GOOGLE_SAFE_BROWSING_KEY = <tu clave>
#   4. Haz redeploy.

[build]
  publish  = "."               # index.html está en la raíz
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"     # bundler rápido, soporta ESM

# ── Redirect: /check → función serverless ────────────────────────────────────
[[redirects]]
  from   = "/check"
  to     = "/.netlify/functions/check"
  status = 200
  force  = true

# ── Cabeceras de seguridad ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "no-referrer"
    Permissions-Policy         = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy    = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cloudflare-dns.com; font-src https://fonts.gstatic.com;"
