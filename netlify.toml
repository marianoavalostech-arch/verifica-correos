# ── Verifica Correos — Configuración de Netlify ──────────────────────────────
#
# Despliegue:
#   1. Sube este repositorio a GitHub.
#   2. En Netlify → "Import from Git" → selecciona el repo.
#   3. En Site settings → Environment variables, añade:
#      GOOGLE_SAFE_BROWSING_KEY = <tu clave>          (recomendada)
#      ABUSECH_AUTH_KEY         = <tu clave>          (recomendada — gratuita en auth.abuse.ch;
#                                                      sin ella URLhaus y ThreatFox no responden)
#      VIRUSTOTAL_API_KEY       = <tu clave>          (opcional — amplía cobertura)
#      ALLOWED_ORIGIN           = https://tu-sitio.netlify.app  (OBLIGATORIA en producción)
#   4. Haz redeploy.

[build]
  publish  = "public"          # solo el frontend; README, package.json y
                               # .env.example quedan fuera del sitio servido
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"          # Node 18 llegó a EOL en abril de 2025; 22 es LTS

[functions]
  node_bundler = "esbuild"     # bundler rápido, soporta ESM

# Nota: la ruta /check y el rate limiting (20 req/min por IP) los define la
# propia función en `export const config` (netlify/functions/check.mjs,
# Functions v2). Ya no se necesita un [[redirects]] para /check aquí.

# ── Eliminar / al final de todas las rutas ───────────────────────────────────
[[redirects]]
  from   = "/*/"
  to     = "/:splat"
  status = 301
  force  = false

# ── Cabeceras de seguridad ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "no-referrer"
    Permissions-Policy         = "geolocation=(), microphone=(), camera=()"
    # Notas CSP:
    # - style-src necesita 'unsafe-inline': la UI de resultados se genera con
    #   atributos style inline (sin él, los resultados se renderizan sin estilos).
    # - connect-src usa https: porque rdap.org responde con un redirect 302 al
    #   servidor RDAP del registro correspondiente (rdap.verisign.com, etc.),
    #   imposible de enumerar de antemano; la CSP valida cada salto del redirect.
    Content-Security-Policy    = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https:; img-src 'self' data:; frame-ancestors 'none'"
